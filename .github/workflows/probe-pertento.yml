# 臨時測試（2026-10-31）：確認 GitHub runner 能否連上 Thai FDA 查詢系統 pertento，測完即刪
name: Probe pertento
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GET search page
        run: curl -sS -m 60 -A 'Mozilla/5.0 (Macintosh) Chrome/120' -o page.html -w 'GET %{http_code} %{size_download}\n' https://pertento.fda.moph.go.th/FDA_SEARCH_DRUG/SEARCH_DRUG/FRM_SEARCH_DRUG.aspx || true
      - name: POST search amlodipine
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, http.cookiejar
          U = "https://pertento.fda.moph.go.th/FDA_SEARCH_DRUG/SEARCH_DRUG/FRM_SEARCH_DRUG.aspx"
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          op.addheaders = [("User-Agent", "Mozilla/5.0 (Macintosh) Chrome/120")]
          try:
              h = op.open(U, timeout=60).read().decode("utf-8", "replace")
              f = dict(re.findall(r'<input[^>]*name="(__[^"]+)"[^>]*value="([^"]*)"', h))
              f.update({"ctl00$ContentPlaceHolder1$txt_substance": "amlodipine", "ctl00$ContentPlaceHolder1$btn_sea_drug": "ค้นหา"})
              r = op.open(U, urllib.parse.urlencode(f).encode(), timeout=60).read().decode("utf-8", "replace")
              rows = re.findall(r'<tr[^>]*class="rg(?:Row|AltRow)"', r)
              print("POST rows", len(rows), "items", re.findall(r'(\d+)\s*</strong>\s*items', r))
          except Exception as e:
              print("POST failed", e)
          PY
