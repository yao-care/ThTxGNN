# 臨時測試（2026-10-31）：GitHub runner 上 pertento 翻頁（每頁 100）與詳細資料介面是否可用、耗時多少，測完即刪
name: Probe pertento paging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: probe
        run: |
          pip install -q requests
          curl -sS -o _pertento.py https://raw.githubusercontent.com/yao-care/ThTxGNN/main/.probe/_pertento.py
          python3 - <<'PY'
          import time, _pertento as p
          for t in ["Morphine", "Amlodipine", "Paracetamol"]:
              s = time.time(); rows, total = p.search(t)
              print(f"{t}: {len(rows)}/{total} rows, {time.time()-s:.0f}s", flush=True)
          s = time.time(); ss = p.detail_session(); d = p.detail(ss, rows[0]["newcode"])
          print("detail", d.get("REGISTER_LICENSE"), [f["FML_NAME"] for f in d.get("XML_DRUG_FORMULA") or []], f"{time.time()-s:.1f}s")
          PY
