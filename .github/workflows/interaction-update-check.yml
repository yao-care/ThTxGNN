name: 藥物交互作用資料更新檢查

# 2026-11-04：本站的安全頁（DDI／DFI／DHI／DDSI）已全刪，只剩 DDInter 2.0 的藥物配對檔
# （data/external/ddi/ddinter/ddinter_code_*.csv），由 src/thtxgnn/collectors/ddinter.py 讀進藥物 bundle 的
# safety.ddi，供藥師報告產線使用。這個 workflow 只監看 DDInter 是否改版。
# 拿掉的部分：Guide to PHARMACOLOGY（產線沒有讀它）、DFI／DDSI／DHI（本站沒有資料），以及指向本站不存在腳本
# （process_ddinter_dfi.py、process_ddinter_ddsi.py、integrate_dfi_dhi.py）的指令。

on:
  schedule:
    - cron: '30 2 * * *'  # 每日 UTC 02:30
  workflow_dispatch:  # 手動觸發

permissions:
  contents: read
  issues: write

jobs:
  check-interaction-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: 讀取版本記錄
        id: local
        run: |
          DDI_COUNT=$(jq -r '.ddinter.ddi_with_mechanism' .github/ddi-versions.json)
          echo "ddi_count=$DDI_COUNT" >> $GITHUB_OUTPUT

      - name: 檢查 DDInter 2.0 DDI 更新
        id: ddi
        run: |
          # API 回傳有機制描述的 DDI 筆數，用來偵測 DDInter 改版
          RESPONSE=$(curl -sS -X POST "https://ddinter2.scbdd.com/server/interaction-source/" \
            -d "draw=1&start=0&length=1" --max-time 30 || echo '{"recordsTotal":0}')

          REMOTE_COUNT=$(echo "$RESPONSE" | jq -r '.recordsTotal // 0')
          LOCAL_COUNT="${{ steps.local.outputs.ddi_count }}"

          echo "remote_count=$REMOTE_COUNT" >> $GITHUB_OUTPUT
          echo "local_count=$LOCAL_COUNT" >> $GITHUB_OUTPUT

          if [ "$REMOTE_COUNT" != "$LOCAL_COUNT" ] && [ "$REMOTE_COUNT" != "0" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "diff=$((REMOTE_COUNT - LOCAL_COUNT))" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "diff=0" >> $GITHUB_OUTPUT
          fi

      - name: 產生檢查報告
        run: |
          echo "## DDInter 2.0 更新檢查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 遠端記錄數（含機制描述） | ${{ steps.ddi.outputs.remote_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 本地記錄數 | ${{ steps.ddi.outputs.local_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 差異 | ${{ steps.ddi.outputs.diff }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 需要更新 | ${{ steps.ddi.outputs.needs_update }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*檢查時間：$(date -u '+%Y-%m-%d %H:%M UTC')*" >> $GITHUB_STEP_SUMMARY

      - name: 建立 Issue（如有更新）
        if: steps.ddi.outputs.needs_update == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = `[資料更新] DDInter DDI (${${{ steps.ddi.outputs.diff }}} 筆差異) 有新版本`;
            const body = `## DDInter 2.0 更新通知

            | 資料來源 | 本地 | 遠端 | 差異 |
            |----------|------|------|------|
            | DDInter DDI（含機制描述） | ${{ steps.ddi.outputs.local_count }} | ${{ steps.ddi.outputs.remote_count }} | ${{ steps.ddi.outputs.diff }} |

            ### 更新步驟

            本站沒有 DDInter 自動處理腳本，請手動：

            1. 從 https://ddinter2.scbdd.com/download/ 下載 \`ddinter_code_*.csv\` 到 \`data/external/ddi/ddinter/\`
            2. 重算 README 的 DDI 配對數，並更新 \`.github/ddi-versions.json\` 的 \`ddinter\`（\`last_checked\`、\`ddi_with_mechanism\`、\`ddi_total_pairs\`）
            3. 需要的話重收藥物 bundle（\`scripts/batch_collect_bundles.py\`）

            ---
            *此 Issue 由 GitHub Actions 自動建立*
            `;

            // 檢查是否已有相同標題的 open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-update'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.startsWith('[資料更新]')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['data-update', 'maintenance']
              });
              console.log('Created new issue');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## 更新檢查 - ${new Date().toISOString().split('T')[0]}

                | 資料來源 | 本地 | 遠端 | 差異 |
                |----------|------|------|------|
                | DDInter DDI（含機制描述） | ${{ steps.ddi.outputs.local_count }} | ${{ steps.ddi.outputs.remote_count }} | ${{ steps.ddi.outputs.diff }} |
                `
              });
              console.log('Updated existing issue');
            }
