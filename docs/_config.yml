# ThTxGNN Jekyll Configuration

title: "ThTxGNN รายงานการตรวจสอบการใช้ยาเก่าในข้อบ่งใช้ใหม่"
description: "ระบบคาดการณ์และตรวจสอบการใช้ยาเก่าในข้อบ่งใช้ใหม่สำหรับยาที่ขึ้นทะเบียนในประเทศไทย"
url: "https://thtxgnn.yao.care"
baseurl: ""
lang: "th"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# RSS Feed
feed:
  path: feed.xml
  collections:
    drugs:
      path: "/drugs/feed.xml"

# Open Graph
og_image: /assets/images/og-default.png

# Kramdown Settings
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    ndash: "--"
    mdash: "---"

# Navigation
nav_sort: case_insensitive

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Footer
footer_content: "Copyright &copy; 2026 藥提醒科技有限公司 (yao.care). รายงานนี้มีไว้เพื่อการวิจัยเท่านั้น ไม่ถือเป็นคำแนะนำทางการแพทย์"

# Color scheme
color_scheme: light

# Aux links
aux_links:
  "GitHub":
    - "https://github.com/yao-care/ThTxGNN"

# Back to top
back_to_top: true
back_to_top_text: "กลับขึ้นด้านบน"

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.template"

# Collections
collections:
  drugs:
    output: true
    permalink: /drugs/:name/
  news:
    output: true
    permalink: /news/:name/

defaults:
  - scope:
      path: "_drugs"
      type: "drugs"
    values:
      layout: "default"
      nav_exclude: false
  - scope:
      path: "_news"
      type: "news"
    values:
      layout: "default"
      nav_exclude: true
  # 2026-11-03：SMART 啟動端點與應用殼（需從 EHR 啟動、沒有可收錄內容）不列入 sitemap；
  # 兩頁本身也有 <meta name="robots" content="noindex">。獨立測試頁 standalone.html 原本照常收錄，
  # 同日用戶決定也改成不收錄、不列入 sitemap（頁面照常可用，只是不進搜尋索引）。
  - scope:
      path: "smart/launch.html"
    values:
      sitemap: false
  - scope:
      path: "smart/app.html"
    values:
      sitemap: false
  - scope:
      path: "smart/standalone.html"
    values:
      sitemap: false
  # 2026-11-05：smart/demo.html 原本是寫死假預測的示範頁，改成轉到 standalone.html 的轉址頁，不列入 sitemap。
  - scope:
      path: "smart/demo.html"
    values:
      sitemap: false



